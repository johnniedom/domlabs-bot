[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "domlabs-bot"
version = "0.1.2"
description = "Use Claude Code from your phone via Telegram. Multi-project sessions, owner-gated, customizable persona."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Dom Labs" },
]
keywords = ["telegram", "bot", "claude", "claude-code", "agent", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
]
dependencies = [
    "claude-agent-sdk>=0.1.72,<0.2.0",
    "python-telegram-bot[rate-limiter]>=21.6",
    "python-dotenv>=1.0.1",
    "questionary>=2.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
voice = [
    "google-genai>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/johnniedom/domlabs-bot"
Repository = "https://github.com/johnniedom/domlabs-bot"
Issues = "https://github.com/johnniedom/domlabs-bot/issues"

[project.scripts]
domlabs-bot = "domlabs_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["domlabs_bot"]

[tool.hatch.build.targets.sdist]
include = [
    "/domlabs_bot",
    "/README.md",
    "/LICENSE",
    "/.env.example",
]
